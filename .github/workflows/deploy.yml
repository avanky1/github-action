name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (runs on the GitHub runner, not on EC2)
        run: npm run build

      - name: Set release id
        run: echo "RELEASE_ID=$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Assemble standalone bundle
        run: |
          cp -r public .next/standalone/ 2>/dev/null || true
          cp -r .next/static .next/standalone/.next/

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload release to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          APP_ROOT: ${{ secrets.EC2_APP_DIR }}
        run: |
          ssh "$EC2_USER@$EC2_HOST" "mkdir -p '$APP_ROOT/releases'"
          rsync -az --delete .next/standalone/ "$EC2_USER@$EC2_HOST:$APP_ROOT/releases/$RELEASE_ID/"
          scp ecosystem.config.js "$EC2_USER@$EC2_HOST:$APP_ROOT/ecosystem.config.js"
          scp scripts/deploy.sh "$EC2_USER@$EC2_HOST:/tmp/deploy.sh"

      - name: Activate release (health check + auto-rollback)
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          APP_ROOT: ${{ secrets.EC2_APP_DIR }}
        run: |
          ssh "$EC2_USER@$EC2_HOST" "bash /tmp/deploy.sh '$APP_ROOT' '$RELEASE_ID'"

      - name: Ensure Nginx is installed
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh "$EC2_USER@$EC2_HOST" '
            set -e
            if ! command -v nginx >/dev/null 2>&1; then
              sudo DEBIAN_FRONTEND=noninteractive apt-get update
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y nginx
            fi
          '

      - name: Deploy Nginx site config
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          scp nginx/mirror1.downly.sbs.conf "$EC2_USER@$EC2_HOST:/tmp/mirror1.downly.sbs.conf"
          ssh "$EC2_USER@$EC2_HOST" '
            set -e
            sudo mv /tmp/mirror1.downly.sbs.conf /etc/nginx/sites-available/mirror1.downly.sbs
            sudo ln -sf /etc/nginx/sites-available/mirror1.downly.sbs /etc/nginx/sites-enabled/mirror1.downly.sbs
            sudo nginx -t
            sudo systemctl reload nginx
          '
